[project]
name = "provecheck"
version = "0.1.0"
description = "Audit every checkable claim in a document. Numbers are recomputed with interval arithmetic, charts are read back against the text, sources are resolved. Verdicts by code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "enestanerr" }]
keywords = ["verification", "fact-checking", "numbers", "charts", "citations", "audit", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/enestanerr/prove"
Repository = "https://github.com/enestanerr/prove"
Issues = "https://github.com/enestanerr/prove/issues"

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
xlsx = ["openpyxl>=3.1"]
logic = ["z3-solver>=4.12"]
fuzzy = ["rapidfuzz>=3.0"]
all = ["pymupdf>=1.24", "openpyxl>=3.1", "z3-solver>=4.12", "rapidfuzz>=3.0"]

[project.scripts]
provecheck = "provecheck.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "jsonschema>=4.20",
  "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provecheck"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "reference", "README.md", "LICENSE", "CHANGELOG.md", "docs/SPEC.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reference", "prove-plan"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
