name: release

# Runs when a version tag is pushed: vX.Y.Z
# PyPI upload uses trusted publishing. Before the first release, add this repository
# and this workflow file as a trusted publisher for the project `provecheck` on PyPI.

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: The tag matches the package and plugin versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" pyproject.toml
          grep -q "\"version\": \"$version\"" plugin/.claude-plugin/plugin.json
      - run: uv run pytest -q
      - run: uv run python reference/test_reference.py
      - run: uv run python evals/run_judge.py
      - run: uv run python tools/build_pyz.py --check
      - run: uv build
      - run: uv run python tools/build_skill_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: rm -f dist/prove-skill.zip
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the skill zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/prove-skill.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
