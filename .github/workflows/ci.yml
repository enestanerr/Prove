name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - name: Tests (no network)
        run: uv run pytest -q
      - name: Verdict-rule reference (must stay 10/10)
        run: uv run python reference/test_reference.py
      - name: Judge eval (zero false alarms is a release gate)
        run: uv run python evals/run_judge.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Zipapp in the repo is what build_pyz.py builds
        run: uv run python tools/build_pyz.py --check
      - name: Examples and reference validate against the schema
        run: uv run python tools/validate_examples.py
