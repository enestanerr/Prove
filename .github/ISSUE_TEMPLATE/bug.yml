name: Bug
description: A crash, a parse failure, a broken install, or the skill going off script.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked, and what came back. Paste the error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Claude Code plugin
        - Skill in another agent
        - Skill on claude.ai or Cowork
        - provecheck CLI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: "`provecheck --version`, Python version, operating system, and `claude --version` if relevant."
    validations:
      required: true
