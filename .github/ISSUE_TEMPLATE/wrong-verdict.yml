name: Wrong verdict
description: provecheck said contradicted, suspect, verified or unverified, and it should not have.
title: "Wrong verdict: "
labels: ["wrong-verdict"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful report you can file. The case goes into the judge eval
        first, failing; then comes the fix. Tolerances are never widened to hide it.

        Please use a made-up or public example. Do not paste confidential documents.
  - type: textarea
    id: document
    attributes:
      label: What the document says
      description: The sentence, table rows or chart description, exactly as printed.
      placeholder: "Revenue rose from $2.10M in Q2 to $2.30M in Q3, up 14%."
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: The claim and its numbers from claims.json
      render: json
    validations:
      required: true
  - type: textarea
    id: printed
    attributes:
      label: What provecheck printed
      description: The line from `provecheck check`, or the card from the report.
      render: text
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: The verdict you expected
      options:
        - verified
        - contradicted
        - suspect
        - unverified
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: One or two sentences. If rounding is involved, say which values behind the printed numbers make your case.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `provecheck --version`, and the model if the claims were written by one.
    validations:
      required: true
